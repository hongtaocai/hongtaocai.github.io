<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Holidays - MiniTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white text-gray-800 p-4 shadow-sm">
        <div class="container mx-auto">
            <a href="./minitools.html" class="hover:text-gray-600 flex items-center font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Back to MiniTool
            </a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Next 10 US National Holidays</h1>
        
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Holiday</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Days from Today</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <!-- Holiday rows will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-8 text-center text-sm text-gray-600">
            <p>Data source: <a href="https://date.nager.at" target="_blank" class="text-blue-600 hover:underline">nager.at Public Holidays API</a></p>
        </div>
    </div>

    <script>
        // Function to get day of week name
        function getDayOfWeek(date) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return days[date.getDay()];
        }

        // Function to format date as Month_str, day, year, Day_of_Week
        function formatDateWithDay(date) {
            const months = ['January', 'February', 'March', 'April', 'May', 'June',
                           'July', 'August', 'September', 'October', 'November', 'December'];
            const month = months[date.getMonth()];
            const day = date.getDate();
            const year = date.getFullYear();
            const dayOfWeek = getDayOfWeek(date);
            return `${month} ${day}, ${year} (${dayOfWeek})`;
        }

        // Function to calculate days between dates
        function daysBetween(date1, date2) {
            const oneDay = 24 * 60 * 60 * 1000; // hours*minutes*seconds*milliseconds
            const diffDays = Math.round(Math.abs((date2 - date1) / oneDay));
            return diffDays;
        }

        // Function to populate the table with holiday data
        function populateHolidayTable(holidays) {
            const today = new Date();
            // Set time to 00:00:00 for proper date comparison
            today.setHours(0, 0, 0, 0);
            
            // Filter out past dates, remove duplicates, and only include public holidays
            const uniqueHolidays = [];
            const seenDates = new Set();
            
            holidays.forEach(holiday => {
                // Check if holiday has "Public" in its types array
                if (!holiday.types || !holiday.types.includes("Public")) {
                    return;
                }
                
                const holidayDate = new Date(holiday.date);
                // Set time to 00:00:00 for proper date comparison
                holidayDate.setHours(0, 0, 0, 0);
                
                // Only include future dates and avoid duplicates
                if (holidayDate >= today && !seenDates.has(holiday.date)) {
                    seenDates.add(holiday.date);
                    uniqueHolidays.push({
                        ...holiday,
                        date: holidayDate
                    });
                }
            });
            
            // Sort by date
            uniqueHolidays.sort((a, b) => a.date - b.date);
            
            // Get next 10 holidays
            const nextHolidays = uniqueHolidays.slice(0, 10);
            
            const tbody = document.querySelector('tbody');
            
            // Clear existing rows
            tbody.innerHTML = '';
            
            // Add rows for next 10 holidays
            if (nextHolidays.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="px-6 py-4 text-center text-sm text-gray-500">
                            No upcoming public holidays found
                        </td>
                    </tr>
                `;
                return;
            }
            
            nextHolidays.forEach(holiday => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                const formattedDateWithDay = formatDateWithDay(holiday.date);
                const daysFromToday = daysBetween(today, holiday.date);
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        <div class="font-semibold">${holiday.name}</div>
                        <div class="text-xs text-gray-500 mt-1">${formattedDateWithDay}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${daysFromToday}</td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Function to show error in table
        function showErrorMessage(errorMsg) {
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="2" class="px-6 py-4 text-center text-sm text-red-600">
                        Error: ${errorMsg}
                    </td>
                </tr>
            `;
        }

        // Function to fetch holidays from Nager.Date API
        async function fetchUSHolidays() {
            try {
                const today = new Date();
                const currentYear = today.getFullYear();
                
                // Fetch holidays for current year
                const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/US`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const holidays = await response.json();
                
                // Validate that we got proper data
                if (!Array.isArray(holidays) || holidays.length === 0) {
                    throw new Error("No holiday data received from API");
                }
                
                populateHolidayTable(holidays);
            } catch (error) {
                console.error('Error fetching holidays:', error);
                showErrorMessage("Failed to load holiday data. Please try again later.");
            }
        }

        // Fetch holidays when page loads
        document.addEventListener('DOMContentLoaded', fetchUSHolidays);
    </script>
</body>
</html>
