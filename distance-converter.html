<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Converter - MiniTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white text-gray-800 p-4 shadow-sm">
        <div class="container mx-auto">
            <a href="./minitools.html" class="hover:text-gray-600 flex items-center font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Back to MiniTool
            </a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Distance Converter</h1>
        
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="mb-6">
                <label for="distance-input" class="block text-sm font-medium text-gray-700 mb-2">Distance Value</label>
                <input 
                    type="number" 
                    id="distance-input" 
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition bg-white"
                    placeholder="Enter distance..."
                    step="any"
                    value="1"
                >
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">From Unit</label>
                    <select id="from-unit" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition bg-white">
                        <option value="meter">Meter (m)</option>
                        <option value="kilometer">Kilometer (km)</option>
                        <option value="centimeter">Centimeter (cm)</option>
                        <option value="mile">Mile (mi)</option>
                        <option value="foot">Foot (ft)</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">To Unit</label>
                    <select id="to-unit" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition bg-white">
                        <option value="meter">Meter (m)</option>
                        <option value="kilometer">Kilometer (km)</option>
                        <option value="centimeter">Centimeter (cm)</option>
                        <option value="mile">Mile (mi)</option>
                        <option value="foot">Foot (ft)</option>
                    </select>
                </div>
            </div>
            
            <div class="bg-gray-50 rounded-lg p-4 mb-6 border border-gray-200">
                <div class="text-center">
                    <p class="text-sm text-gray-600">Result</p>
                    <p id="result" class="text-2xl font-bold text-gray-800 mt-1">1.000000 m</p>
                </div>
            </div>
            
            <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                <h3 class="font-medium text-gray-800 mb-2">Common Conversion Factors</h3>
                <p class="text-sm text-gray-600">
                    1 km = 1000 m<br>
                    1 m = 100 cm<br>
                    1 mile = 1609.34 m<br>
                    1 foot = 0.3048 m
                </p>
            </div>
        </div>
    </div>

    <script>
        // Conversion factors to meters
        const CONVERSION_FACTORS = {
            'meter': 1,
            'kilometer': 1000,
            'centimeter': 0.01,
            'mile': 1609.34,
            'foot': 0.3048
        };
        
        // Get references to elements
        const distanceInput = document.getElementById('distance-input');
        const fromUnitSelect = document.getElementById('from-unit');
        const toUnitSelect = document.getElementById('to-unit');
        const resultElement = document.getElementById('result');
        
        // Convert distance
        function convertDistance() {
            const inputValue = parseFloat(distanceInput.value);
            const fromUnit = fromUnitSelect.value;
            const toUnit = toUnitSelect.value;
            
            if (isNaN(inputValue)) {
                resultElement.textContent = 'Invalid input';
                return;
            }
            
            // Convert to meters first, then to target unit
            const meters = inputValue * CONVERSION_FACTORS[fromUnit];
            const result = meters / CONVERSION_FACTORS[toUnit];
            
            // Format result with appropriate decimal places
            let decimalPlaces = 6;
            if (result >= 1000000) decimalPlaces = 0;
            else if (result >= 1000) decimalPlaces = 1;
            else if (result >= 1) decimalPlaces = 2;
            else if (result >= 0.01) decimalPlaces = 4;
            else decimalPlaces = 6;
            
            const formattedResult = result.toFixed(decimalPlaces);
            const unitName = toUnit === 'meter' ? 'm' : 
                             toUnit === 'kilometer' ? 'km' : 
                             toUnit === 'centimeter' ? 'cm' : 
                             toUnit === 'mile' ? 'mi' : 'ft';
            
            resultElement.textContent = `${formattedResult} ${unitName}`;
        }
        
        // Event listeners
        distanceInput.addEventListener('input', convertDistance);
        fromUnitSelect.addEventListener('change', convertDistance);
        toUnitSelect.addEventListener('change', convertDistance);
        
        // Initialize
        convertDistance();
    </script>
</body>
</html>
