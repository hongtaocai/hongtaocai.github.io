<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unix Time Converter - MiniTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white text-gray-800 p-4 shadow-sm">
        <div class="container mx-auto">
            <a href="./minitools.html" class="hover:text-gray-600 flex items-center font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Back to MiniTool
            </a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Unix Time Converter</h1>
        
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="mb-6">
                <label for="unix-input" class="block text-sm font-medium text-gray-700 mb-2">Unix Timestamp</label>
                <input 
                    type="number" 
                    id="unix-input" 
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition bg-white"
                    placeholder="Enter Unix timestamp..."
                    value="1609459200"
                >
                <div class="mt-2 text-sm text-gray-500">
                    <span class="inline-block bg-gray-100 px-2 py-1 rounded">Examples: 1609459200, 0, 1577836800</span>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Human Readable Date</label>
                    <input 
                        type="text" 
                        id="date-output" 
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-50 cursor-default"
                        readonly
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">ISO Format</label>
                    <input 
                        type="text" 
                        id="iso-output" 
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-50 cursor-default"
                        readonly
                    >
                </div>
            </div>
            
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Current Unix Time</label>
                    <span id="current-unix" class="text-sm font-mono text-gray-600"></span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-emerald-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <button 
                    class="px-4 py-3 bg-emerald-100 text-emerald-700 rounded-lg font-medium border border-emerald-300 hover:bg-emerald-200 transition"
                    onclick="setUnixTime(Date.now() / 1000)"
                >
                    Current Time → Unix
                </button>
                <button 
                    class="px-4 py-3 bg-sky-100 text-sky-700 rounded-lg font-medium border border-sky-300 hover:bg-sky-200 transition"
                    onclick="setDateAsUnix()"
                >
                    Unix → Current Time
                </button>
            </div>
            
            <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                <h3 class="font-medium text-gray-800 mb-2">About Unix Time</h3>
                <p class="text-sm text-gray-600">
                    Unix time is the number of seconds that have elapsed since January 1, 1970 (UTC). 
                    It's widely used in computing systems and represents a point in time regardless of timezone.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Function to convert Unix timestamp to readable date
        function unixToDate(unixTimestamp) {
            const date = new Date(unixTimestamp * 1000);
            return date.toLocaleString();
        }
        
        // Function to convert Unix timestamp to ISO format
        function unixToIso(unixTimestamp) {
            const date = new Date(unixTimestamp * 1000);
            return date.toISOString();
        }
        
        // Function to update outputs based on Unix timestamp
        function updateOutputs() {
            const unixInput = parseFloat(document.getElementById('unix-input').value);
            
            if (isNaN(unixInput)) {
                document.getElementById('date-output').value = 'Invalid Unix timestamp';
                document.getElementById('iso-output').value = 'Invalid Unix timestamp';
                return;
            }
            
            document.getElementById('date-output').value = unixToDate(unixInput);
            document.getElementById('iso-output').value = unixToIso(unixInput);
        }
        
        // Set Unix time to current
        function setUnixTime(timestamp) {
            document.getElementById('unix-input').value = Math.floor(timestamp);
            updateOutputs();
        }
        
        // Convert current time to Unix timestamp
        function setDateAsUnix() {
            document.getElementById('unix-input').value = Math.floor(Date.now() / 1000);
            updateOutputs();
        }
        
        // Update current Unix time display
        function updateCurrentUnixTime() {
            const currentUnix = Math.floor(Date.now() / 1000);
            document.getElementById('current-unix').textContent = currentUnix;
            
            // Calculate progress percentage (based on days since epoch)
            const daysSinceEpoch = Math.floor(currentUnix / (24 * 60 * 60));
            // Show progress as percentage of days in the current year
            const startOfYear = new Date(new Date().getFullYear(), 0, 1).getTime() / 1000;
            const endOfYear = new Date(new Date().getFullYear() + 1, 0, 1).getTime() / 1000;
            const yearDuration = endOfYear - startOfYear;
            const elapsedInYear = currentUnix - startOfYear;
            const progressPercent = Math.min(100, Math.max(0, (elapsedInYear / yearDuration) * 100));
            
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }
        
        // Event listeners
        document.getElementById('unix-input').addEventListener('input', updateOutputs);
        
        // Initialize
        updateOutputs();
        updateCurrentUnixTime();
        
        // Update current time every second
        setInterval(updateCurrentUnixTime, 1000);
    </script>
</body>
</html>
