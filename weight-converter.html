<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Converter - MiniTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white text-gray-800 p-4 shadow-sm">
        <div class="container mx-auto">
            <a href="./minitools.html" class="hover:text-gray-600 flex items-center font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Back to MiniTool
            </a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-md">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Weight Converter</h1>
        
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="space-y-4">
                <!-- Pound Input -->
                <div>
                    <label for="pounds" class="block text-sm font-medium text-gray-700 mb-1">Pounds (lb)</label>
                    <input 
                        type="number" 
                        id="pounds" 
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition bg-white"
                        placeholder="Enter weight in pounds..."
                        step="any"
                        value="1"
                    >
                </div>
                
                <!-- Kilogram Input -->
                <div>
                    <label for="kilograms" class="block text-sm font-medium text-gray-700 mb-1">Kilograms (kg)</label>
                    <input 
                        type="number" 
                        id="kilograms" 
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition bg-white"
                        placeholder="Enter weight in kilograms..."
                        step="any"
                        value="0.453592"
                    >
                </div>
            </div>
        </div>
        
        <div class="mt-8 text-center text-sm text-gray-600">
            <p>Conversion Formulas:</p>
            <p>1 lb = 0.453592 kg</p>
            <p>1 kg = 2.20462 lb</p>
        </div>
    </div>

    <script>
        // Get references to the input fields
        const poundsInput = document.getElementById('pounds');
        const kilogramsInput = document.getElementById('kilograms');
        
        // Conversion constants
        const POUNDS_TO_KILOGRAMS = 0.453592;
        const KILOGRAMS_TO_POUNDS = 2.20462;
        
        // Update kilograms when pounds changes
        poundsInput.addEventListener('input', function() {
            const pounds = parseFloat(this.value);
            if (!isNaN(pounds)) {
                kilogramsInput.value = (pounds * POUNDS_TO_KILOGRAMS).toFixed(6);
            } else {
                kilogramsInput.value = '';
            }
        });
        
        // Update pounds when kilograms changes
        kilogramsInput.addEventListener('input', function() {
            const kilograms = parseFloat(this.value);
            if (!isNaN(kilograms)) {
                poundsInput.value = (kilograms * KILOGRAMS_TO_POUNDS).toFixed(6);
            } else {
                poundsInput.value = '';
            }
        });
    </script>
</body>
</html>
