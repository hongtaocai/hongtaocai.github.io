<!DOCTYPE html>
<!-- inspired by inspira-ui.com, created with opencode / muse-spark 1.2  -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fluid Cursor — Pure Black</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&family=Alumni+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #010000eb;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: ui-sans-system, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #010000eb;
    color: #fff;
    cursor: default;
  }
  #fluid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 1;
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(800px 600px at 50% 35%, rgba(255,255,255,0.04), transparent 70%),
      radial-gradient(1200px 800px at 50% 100%, rgba(255,255,255,0.02), transparent 70%);
  }
  /* stage centered with perspective for floating card */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 2rem;
    perspective: 1400px;
    perspective-origin: 50% 50%;
  }
  .floating-wrap {
    perspective: 1400px;
    transform-style: preserve-3d;
    /* subtle idle float when not interacting */
    animation: cardFloat 6s ease-in-out infinite;
  }
  .floating-wrap.is-interacting {
    animation: none;
  }
  @keyframes cardFloat {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  .floating-card {
    position: relative;
    width: min(480px, 86vw);
    aspect-ratio: 1 / 1.618; /* golden ratio: height = width * 1.618 */
    max-height: 86vh;
    /* bigger: width 440-520px gives height 712-841px via golden ratio */
    background: rgba(28,28,29,0.32);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 24px;
    backdrop-filter: blur(12px) saturate(1.15);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    transform-style: preserve-3d;
    will-change: transform;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* inspira-style deep shadow */
    box-shadow:
      rgba(0,0,0,0.01) 0px 520px 146px 0px,
      rgba(0,0,0,0.04) 0px 333px 133px 0px,
      rgba(0,0,0,0.26) 0px 83px 83px 0px,
      rgba(0,0,0,0.29) 0px 21px 46px 0px,
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 1px 0 rgba(255,255,255,0.06) inset;
    transition: box-shadow 0.3s ease;
  }
  .floating-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02) 40%, transparent 70%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: 0.9;
  }
  .glare {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    mix-blend-mode: overlay;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9) 10%, rgba(255,255,255,0.75) 20%, rgba(255,255,255,0) 80%);
    transition: opacity 0.2s ease;
  }
  .card-inner {
    position: relative;
    z-index: 2;
    padding: 52px 36px 40px;
    text-align: center;
    transform: translateZ(28px);
    transform-style: preserve-3d;
    user-select: text;
    -webkit-user-select: text;
    font-family: "Alumni Sans", "Albert Sans", Arial, sans-serif;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 0.44rem 0.88rem;
    border-radius: 999px;
    margin-bottom: 1.6rem;
    transform: translateZ(12px);
  }
  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }
  h1 {
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 0.9;
    color: #fff;
    transform: translateZ(18px) translateY(-24px);
  }
  h1 em {
    font-style: normal;
    font-weight: 300;
    letter-spacing: -0.05em;
    color: rgba(255,255,255,0.45);
  }
  .subtitle {
    margin-top: 1.15rem;
    font-size: clamp(0.92rem, 2vw, 1.12rem);
    line-height: 1.6;
    color: rgba(255,255,255,0.92);
    font-weight: 400;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    transform: translateZ(14px);
    font-family: "Albert Sans", "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  .subtitle strong {
    color: rgba(255,255,255,0.86);
    font-weight: 500;
  }
  .hint {
    margin-top: 2.6rem;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.84rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.30);
    transform: translateZ(10px);
    font-family: "Albert Sans", "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  .hint span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .hint a {
    color: #ffba00;
    text-decoration: none;
    border-bottom: 1px dashed rgba(255,186,0,0.38);
    padding-bottom: 1px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, opacity 0.15s;
    user-select: auto;
    -webkit-user-select: auto;
    pointer-events: auto;
  }
  .hint a:hover {
    color: #ffba00;
    border-bottom-color: rgba(255,186,0,0.85);
    border-bottom-style: solid;
  }
  .hint a:focus-visible {
    outline: 1px solid rgba(255,255,255,0.35);
    outline-offset: 3px;
    border-radius: 2px;
  }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.30); }
  /* card footer meta like inspira demo */
  .card-meta {
    margin-top: 1.6rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.55);
    transform: translateZ(8px);
  }
  .card-meta .meta-right { color: rgba(255,255,255,0.32); }
  @media (max-width: 640px) {
    .floating-card { width: min(86vw, 400px); aspect-ratio: 1 / 1.618; max-height: 84vh; border-radius: 20px; }
    .floating-card::before, .glare { border-radius: 20px; }
    .card-inner { padding: 32px 22px 26px; }
    h1 { font-size: clamp(2.1rem, 9vw, 3.2rem); }
    .hint { flex-direction: column; gap: 0.35rem; }
    .hint .dot { display: none; }
    .floating-wrap { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .floating-wrap { animation: none; }
    .floating-card { transition: none; }
  }
</style>

<div class="vignette" aria-hidden="true"></div>

<div class="stage" id="stage">

<script>
(() => {
  const canvas = document.getElementById('fluid');
  if (!canvas) return;
  const config = {
    SIM_RESOLUTION: 128,
    DYE_RESOLUTION: 1440,
    CAPTURE_RESOLUTION: 512,
    DENSITY_DISSIPATION: 3.5,
    VELOCITY_DISSIPATION: 2,
    PRESSURE: 0.1,
    PRESSURE_ITERATIONS: 20,
    CURL: 3,
    SPLAT_RADIUS: 0.2,
    SPLAT_FORCE: 6000,
    SHADING: true,
    COLOR_UPDATE_SPEED: 10,
    PAUSED: false,
    BACK_COLOR: { r: 0, g: 0, b: 0 },
    TRANSPARENT: true,
    RAINBOW_MODE: true,
    COLOR: '#ffffff'
  };
  function pointerPrototype() {
    this.id = -1;
    this.texcoordX = 0;
    this.texcoordY = 0;
    this.prevTexcoordX = 0;
    this.prevTexcoordY = 0;
    this.deltaX = 0;
    this.deltaY = 0;
    this.down = false;
    this.moved = false;
    this.color = [0,0,0];
  }
  let pointers = [new pointerPrototype()];
  let { gl, ext } = getWebGLContext(canvas);
  if (!gl) { console.warn('WebGL not supported'); return; }
  if (!ext.supportLinearFiltering) { config.DYE_RESOLUTION = 512; config.SHADING = false; }
  function getWebGLContext(canvas) {
    const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
    let gl = canvas.getContext('webgl2', params);
    const isWebGL2 = !!gl;
    if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
    if (!gl) return { gl: null, ext: {} };
    let halfFloat;
    let supportLinearFiltering;
    if (isWebGL2) {
      gl.getExtension('EXT_color_buffer_float');
      supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
    } else {
      halfFloat = gl.getExtension('OES_texture_half_float');
      supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
    }
    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat && halfFloat.HALF_FLOAT_OES;
    let formatRGBA, formatRG, formatR;
    if (isWebGL2) {
      formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
      formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
      formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
    } else {
      formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      formatRG = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      formatR = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
    }
    return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
  }
  function getSupportedFormat(gl, internalFormat, format, type) {
    if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
      switch (internalFormat) {
        case gl.R16F: return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
        case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
        default: return null;
      }
    }
    return { internalFormat, format };
  }
  function supportRenderTextureFormat(gl, internalFormat, format, type) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    return status === gl.FRAMEBUFFER_COMPLETE;
  }
  class Material {
    constructor(vertexShader, fragmentShaderSource) {
      this.vertexShader = vertexShader;
      this.fragmentShaderSource = fragmentShaderSource;
      this.programs = [];
      this.activeProgram = null;
      this.uniforms = [];
    }
    setKeywords(keywords) {
      let hash = 0;
      for (let i = 0; i < keywords.length; i++) hash += hashCode(keywords[i]);
      let program = this.programs[hash];
      if (program == null) {
        let fragmentShader = compileShader(gl.FRAGMENT_SHADER, this.fragmentShaderSource, keywords);
        program = createProgram(this.vertexShader, fragmentShader);
        this.programs[hash] = program;
      }
      if (program === this.activeProgram) return;
      this.uniforms = getUniforms(program);
      this.activeProgram = program;
    }
    bind() { gl.useProgram(this.activeProgram); }
  }
  class Program {
    constructor(vertexShader, fragmentShader) {
      this.program = createProgram(vertexShader, fragmentShader);
      this.uniforms = getUniforms(this.program);
    }
    bind() { gl.useProgram(this.program); }
  }
  function createProgram(vertexShader, fragmentShader) {
    let program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.trace(gl.getProgramInfoLog(program));
    return program;
  }
  function getUniforms(program) {
    let uniforms = [];
    let uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < uniformCount; i++) {
      let uniformName = gl.getActiveUniform(program, i).name;
      uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
    }
    return uniforms;
  }
  function compileShader(type, source, keywords) {
    source = addKeywords(source, keywords);
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.trace(gl.getShaderInfoLog(shader));
    return shader;
  }
  function addKeywords(source, keywords) {
    if (!keywords) return source;
    let keywordsString = '';
    keywords.forEach(k => { keywordsString += '#define ' + k + '\n'; });
    return keywordsString + source;
  }
  const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
    precision highp float;
    attribute vec2 aPosition;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform vec2 texelSize;
    void main () {
        vUv = aPosition * 0.5 + 0.5;
        vL = vUv - vec2(texelSize.x, 0.0);
        vR = vUv + vec2(texelSize.x, 0.0);
        vT = vUv + vec2(0.0, texelSize.y);
        vB = vUv - vec2(0.0, texelSize.y);
        gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `);
  const copyShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    void main () { gl_FragColor = texture2D(uTexture, vUv); }
  `);
  const clearShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    uniform float value;
    void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
  `);
  const displayShaderSource = `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uTexture;
    uniform vec2 texelSize;
    void main () {
        vec3 c = texture2D(uTexture, vUv).rgb;
        #ifdef SHADING
            vec3 lc = texture2D(uTexture, vL).rgb;
            vec3 rc = texture2D(uTexture, vR).rgb;
            vec3 tc = texture2D(uTexture, vT).rgb;
            vec3 bc = texture2D(uTexture, vB).rgb;
            float dx = length(rc) - length(lc);
            float dy = length(tc) - length(bc);
            vec3 n = normalize(vec3(dx, dy, length(texelSize)));
            vec3 l = vec3(0.0, 0.0, 1.0);
            float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
            c *= diffuse;
        #endif
        float a = max(c.r, max(c.g, c.b));
        gl_FragColor = vec4(c, a);
    }
  `;
  const splatShader = compileShader(gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uTarget;
    uniform float aspectRatio;
    uniform vec3 color;
    uniform vec2 point;
    uniform float radius;
    void main () {
        vec2 p = vUv - point.xy;
        p.x *= aspectRatio;
        vec3 splat = exp(-dot(p, p) / radius) * color;
        vec3 base = texture2D(uTarget, vUv).xyz;
        gl_FragColor = vec4(base + splat, 1.0);
    }
  `);
  const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform vec2 dyeTexelSize;
    uniform float dt;
    uniform float dissipation;
    vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
        vec2 st = uv / tsize - 0.5;
        vec2 iuv = floor(st);
        vec2 fuv = fract(st);
        vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
        vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
        vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
        vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
        return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
    }
    void main () {
        #ifdef MANUAL_FILTERING
            vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
            vec4 result = bilerp(uSource, coord, dyeTexelSize);
        #else
            vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
            vec4 result = texture2D(uSource, coord);
        #endif
        float decay = 1.0 + dissipation * dt;
        gl_FragColor = result / decay;
    }
  `, ext.supportLinearFiltering ? null : ['MANUAL_FILTERING']);
  const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uVelocity, vL).x;
        float R = texture2D(uVelocity, vR).x;
        float T = texture2D(uVelocity, vT).y;
        float B = texture2D(uVelocity, vB).y;
        vec2 C = texture2D(uVelocity, vUv).xy;
        if (vL.x < 0.0) { L = -C.x; }
        if (vR.x > 1.0) { R = -C.x; }
        if (vT.y > 1.0) { T = -C.y; }
        if (vB.y < 0.0) { B = -C.y; }
        float div = 0.5 * (R - L + T - B);
        gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }
  `);
  const curlShader = compileShader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uVelocity, vL).y;
        float R = texture2D(uVelocity, vR).y;
        float T = texture2D(uVelocity, vT).x;
        float B = texture2D(uVelocity, vB).x;
        float vorticity = R - L - T + B;
        gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
    }
  `);
  const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    uniform sampler2D uCurl;
    uniform float curl;
    uniform float dt;
    void main () {
        float L = texture2D(uCurl, vL).x;
        float R = texture2D(uCurl, vR).x;
        float T = texture2D(uCurl, vT).x;

<script>
(() => {
  const wrap = document.getElementById('floatingWrap');
  const card = document.getElementById('floatingCard');
  const glare = document.getElementById('glare');
  if (!wrap || !card || !glare) return;

  const ROTATE_DEPTH = 8; // deg, match inspira prop
  const TRANSLATE_DEPTH = 8; // px

  // spring-like smoothed values
  let targetX = 0, targetY = 0;
  let curX = 0, curY = 0;
  let targetScale = 1, curScale = 1;
  let targetZ = 0, curZ = 0;
  let targetGlare = 0, curGlare = 0;

  function renderLoop(){
    // spring damping approx
    const damp = 0.06; // lower = smoother/slower

    curY = lerp(curY, targetY, damp);
    curScale = lerp(curScale, targetScale, 0.14);
    curZ = lerp(curZ, targetZ, 0.14);
    curGlare = lerp(curGlare, targetGlare, 0.16);

    const rotateX = curY * ROTATE_DEPTH * 2; // -0.5..0.5 => -17.5..17.5

    const translateX = curX * TRANSLATE_DEPTH * 2;
    const translateY = -curY * TRANSLATE_DEPTH * 2;
    const glareX = (curX + 0.5) * 100;
    const glareY = (curY + 0.5) * 100;

    card.style.transform = `translateX(${translateX}px) translateY(${translateY}px) translateZ(${curZ}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${curScale})`;
    glare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255,255,255,0.45) 10%, rgba(255,255,255,0.30) 20%, rgba(255,255,255,0) 80%)`;
    glare.style.opacity = String(curGlare);

    // keep looping while moving
    const stillMoving = Math.abs(curX-targetX)>0.0005 || Math.abs(curY-targetY)>0.0005 || Math.abs(curScale-targetScale)>0.0005 || Math.abs(curZ-targetZ)>0.0005 || Math.abs(curGlare-targetGlare)>0.001;

    if (reduceMotion) return;
    if (e.pointerType === 'touch') return;
    const rect = wrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const xPct = (e.clientX - rect.left) / rect.width - 0.5;
    const yPct = (e.clientY - rect.top) / rect.height - 0.5;

  wrap.addEventListener('pointerenter', onEnter);
  wrap.addEventListener('pointerleave', onLeave);
  wrap.addEventListener('pointercancel', onLeave);

  // keyboard accessibility: focus shows slight lift
  card.setAttribute('tabindex','0');
  card.addEventListener('focus', onEnter);
  card.addEventListener('blur', onLeave);

  // init
