<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - MiniTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9SWN0KLH15"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-9SWN0KLH15');
    </script>
</head>

<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white text-gray-800 p-4 shadow-sm">
        <div class="container mx-auto">
            <a href="./minitools.html" class="hover:text-gray-600 flex items-center font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-600" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Back to MiniTool
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-md">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Simple Calculator</h1>

        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="mb-4">
                <label for="calculation-input" class="block text-sm font-medium text-gray-700 mb-2">Expression</label>
                <textarea id="calculation-input"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition bg-white resize-none"
                    placeholder="Enter a mathematical expression (e.g., 2 + 3 * 4)" rows="4"></textarea>
            </div>

            <div class="bg-gray-50 rounded-lg p-4 mb-6 border border-gray-200">
                <div class="text-center">
                    <p class="text-sm text-gray-600">Result</p>
                    <p id="result" class="text-2xl font-bold text-gray-800 mt-1">0</p>
                </div>
            </div>

            <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                <h3 class="font-medium text-gray-800 mb-2">Supported Operations</h3>
                <p class="text-sm text-gray-600">
                    Basic arithmetic: +, -, *, /<br>
                    Exponents: ^ or **<br>
                    Parentheses: ( )<br>
                    Example: (5 + 3) * 2 / 4
                </p>
            </div>
        </div>
    </div>

    <script>
        // Get references to the input and result elements
        const calcInput = document.getElementById('calculation-input');
        const resultElement = document.getElementById('result');

        // Function to safely evaluate mathematical expressions
        function safeEval(expr) {
            try {
                // Replace ^ with ** for exponentiation
                expr = expr.replace(/\^/g, '**');

                // Validate expression to only contain numbers and operators
                if (/[^0-9+\-*/(). \t\n\r]/.test(expr)) {
                    throw new Error('Invalid characters');
                }

                // Check for potentially dangerous patterns
                if (/[a-zA-Z_$]/.test(expr)) {
                    throw new Error('Invalid characters');
                }

                // Evaluate the expression using Function constructor (safer alternative to eval)
                const result = new Function('return ' + expr)();

                // Check if result is a number
                if (typeof result !== 'number' || isNaN(result) || !isFinite(result)) {
                    throw new Error('Invalid result');
                }

                return result;
            } catch (e) {
                return 'Error';
            }
        }

        // Update result when input changes
        calcInput.addEventListener('input', function () {
            const expr = calcInput.value.trim();

            if (expr === '') {
                resultElement.textContent = '0';
                return;
            }

            const result = safeEval(expr);
            resultElement.textContent = typeof result === 'number' ? result.toFixed(6).replace(/\.?0+$/, '') : result;
        });

        // Initialize with a simple example
        calcInput.value = '2 + 3 * 4';
        calcInput.dispatchEvent(new Event('input'));
    </script>
</body>

</html>
